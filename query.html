<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cek Jadwal — Antar Jemput Bandara</title>
<!-- ⚠️ 改了 CSS 或 JS 一定要把 ?v= 往上加，index.html、admin.html 都要一起改，
     而且 js/config.js 的 SYSTEM_INFO.version 與 gas/Config.js 也要同步。
     GitHub Pages 會讓瀏覽器把資源快取 10 分鐘，漏改的話後端已經更新
     而前端還是舊的，畫面會用「錯誤的方式」壞掉。 -->
<link rel="stylesheet" href="css/style.css?v=2.1">
</head>
<body>

<header class="topbar">
  <!-- 返回鍵放最左上角，做成有邊框的按鈕而不是純文字連結：
       純文字在手機上又小又不像可以點，使用者會找不到出口 -->
  <a class="backbtn" href="index.html">
    <span aria-hidden="true">←</span>
    <span data-i18n="nav.home">Beranda</span>
  </a>
  <span class="brand" data-i18n="app.name">Antar Jemput Bandara</span>
  <nav class="lang" aria-label="Language">
    <button type="button" data-lang="id" aria-pressed="true">ID</button>
    <button type="button" data-lang="zh" aria-pressed="false">中</button>
  </nav>
</header>

<main class="wrap">

  <h1 data-i18n="query.title">Cek Jadwal</h1>

  <form id="searchForm" class="card card--lift">

    <div class="tabs" role="group">
      <button type="button" data-mode="email"  aria-pressed="true"  data-i18n="query.tab.email">Email</button>
      <button type="button" data-mode="date"   aria-pressed="false" data-i18n="query.tab.date">Tanggal Pesawat</button>
      <button type="button" data-mode="flight" aria-pressed="false" data-i18n="query.tab.flight">NO Pesawat</button>
    </div>

    <div class="field" id="field-email">
      <label for="inputEmail" data-i18n="query.email.label">Alamat email</label>
      <input type="text" id="inputEmail" autocomplete="email" inputmode="email"
             autocapitalize="off" spellcheck="false" placeholder="kyle.ma">
      <div class="hint" data-i18n="query.email.hint"></div>
    </div>

    <div class="field" id="field-date" hidden>
      <label for="inputDate" data-i18n="query.date.label">Tanggal Pesawat</label>
      <input type="date" id="inputDate">
      <!-- ⚠️ 輸入框本身的顯示順序跟著裝置地區設定走，管不了。
           這一行由我們控制，一定是 dd/mm/yyyy（見 js/query.js 的 showPickedDate） -->
      <div class="picked" id="pickedDate" aria-live="polite"></div>
      <div class="hint" data-i18n="query.date.hint"></div>
    </div>

    <div class="field" id="field-flight" hidden>
      <label for="inputFlight" data-i18n="query.flight.label">NO Pesawat</label>
      <input type="text" id="inputFlight" autocapitalize="characters" spellcheck="false"
             placeholder="CI761">
      <div class="hint" data-i18n="query.flight.hint"></div>
    </div>

    <button type="submit" class="btn" id="submitBtn" data-i18n="query.submit">Cari</button>
  </form>

  <div id="result" aria-live="polite"></div>

  <footer class="foot">
    <div id="footInfo"></div>
    <a class="foot-admin" id="footAdmin" href="admin.html">Login Admin</a>
  </footer>

</main>

<script src="js/config.js?v=2.1"></script>
<script src="js/i18n.js?v=2.1"></script>
<script src="js/api.js?v=2.1"></script>
<script src="js/query.js?v=2.1"></script>

</body>
</html>
