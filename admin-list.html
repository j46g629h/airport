<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#EFEFED">
<meta name="robots" content="noindex, nofollow">
<!-- 圖示與主畫面設定的完整說明在 index.html 的 <head> -->
<link rel="icon" href="favicon.svg?v=3.1" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3.1">
<link rel="manifest" href="manifest.json?v=3.1">
<!-- CSS 還沒下載完之前先鋪底色，避免工廠 wifi 慢時先白閃一下 -->
<style>html{background:#EFEFED}</style>
<title>Daftar Jadwal — PCI Antar Jemput Bandara</title>
<!-- ⚠️ 改了 CSS 或 JS 一定要把所有 HTML 的 ?v= 一起往上加，
     js/config.js 與 gas/Config.js 的 version 也要同步（tools/check.js 會比對） -->
<link rel="stylesheet" href="css/style.css?v=3.1">
</head>
<body>

<!--
  班表列表（階段 2c，唯讀）。新增／修改在 2d。

  ⚠️ 這一頁看得到**全部歷史**，沒有使用者端那條「今天以後」的限制，
     所以後端那一支一定要包 withAuth（見 gas/Main.js 的路由表）。

  ── 篩選分兩層，是刻意的 ──────────────────────────────
  「日期區間」要打 API（它決定要讀多少資料，一趟 3~8 秒）；
  其餘全部在瀏覽器裡做，打字就即時反應。
  全部都打後端的話，管理者調一次條件等五秒，這一頁就不會有人用。
-->

<header class="topbar">
  <a class="backbtn" href="admin.html">
    <span aria-hidden="true">←</span>
    <span class="word" data-i18n="acc.back">Admin</span>
  </a>
  <span class="brand" data-i18n="list.title">Daftar Jadwal</span>
  <nav class="lang" aria-label="Language">
    <button type="button" data-lang="id" aria-pressed="true">ID</button>
    <button type="button" data-lang="zh" aria-pressed="false">中</button>
  </nav>
</header>

<!--
  管理端導覽列（v2.7）。登入後在每一頁都看得到，不必按上一頁再點進去。

  ⚠️ id 用 pageNav 不用 adminNav——admin.html 已經有一個 #adminNav 是別的東西
     （登入後那個只給超管看的「帳號管理」按鈕）。同名不同義最容易讓人改錯地方。
  ⚠️ 只有超級管理者看得到「帳號管理」。後端也會擋（gas/Admins.js 的 withSuper），
     這裡只是不要讓一般管理者點進去撞牆。
  ⚠️ 預設 hidden。真正決定顯不顯示的是 js/admin-session.js 的 renderPageNav()——
     一般管理者目前只有一項可以去，單獨一顆按鈕的導覽列看起來像壞掉，
     那種情況乾脆整條不顯示（2d 加了「新增」就會自然有兩項）。
-->
<nav class="adminnav" id="pageNav" aria-label="Admin" hidden>
  <a href="admin-list.html" data-nav="list" data-i18n="nav.list">Daftar Jadwal</a>
  <a href="admin-accounts.html" data-nav="accounts" data-super data-i18n="nav.accounts">Kelola Akun</a>
</nav>

<main class="wrap wrap--wide">

  <div id="adminMsg" role="alert" hidden></div>

  <div id="content" hidden>

    <section class="card card--lift" id="filterBox">

      <!-- ── 第一層：日期區間。改這個才會重新打 API ── -->
      <div class="field">
        <label data-i18n="list.range">Rentang tanggal</label>
        <div class="daterange">
          <div class="daterange-one">
            <span class="daterange-lab" data-i18n="list.from">Dari</span>
            <!-- ⚠️ <input type="date"> 的顯示順序跟著裝置地區設定走，管不了。
                 下面那一行由我們控制，一定是 dd/mm/yyyy -->
            <input type="date" id="fFrom">
            <div class="picked" id="pickedFrom" aria-live="polite"></div>
          </div>
          <div class="daterange-one">
            <span class="daterange-lab" data-i18n="list.to">Sampai</span>
            <input type="date" id="fTo">
            <div class="picked" id="pickedTo" aria-live="polite"></div>
          </div>
        </div>

        <div class="chips" id="quickRange">
          <button type="button" class="chip" data-range="week"   data-i18n="list.quick.week"></button>
          <button type="button" class="chip" data-range="next14" data-i18n="list.quick.14"></button>
          <button type="button" class="chip" data-range="month"  data-i18n="list.quick.month"></button>
          <button type="button" class="chip" data-range="past14" data-i18n="list.quick.past"></button>
          <button type="button" class="chip" data-range="all"    data-i18n="list.quick.all"></button>
        </div>

        <button type="button" class="btn" id="searchBtn" data-i18n="list.search">Tampilkan</button>
      </div>

      <hr class="sep">

      <!-- ── 第二層：即時篩選，不打 API ── -->
      <p class="hint" data-i18n="list.liveHint"></p>

      <div class="field">
        <label for="fKeyword" data-i18n="list.keyword">Nama / email / kamar</label>
        <input type="text" id="fKeyword" data-i18n-ph="list.keyword.ph"
               autocapitalize="off" spellcheck="false">
      </div>

      <div class="field">
        <label data-i18n="list.arah">Jemput / Antar</label>
        <div class="chips" id="fArah">
          <button type="button" class="chip" data-val=""        aria-pressed="true"  data-i18n="list.all"></button>
          <button type="button" class="chip" data-val="PICKUP"  aria-pressed="false" data-i18n="arah.PICKUP"></button>
          <button type="button" class="chip" data-val="DROPOFF" aria-pressed="false" data-i18n="arah.DROPOFF"></button>
        </div>
      </div>

      <div class="field">
        <label data-i18n="list.status">Status</label>
        <!-- 可複選。一個都沒選＝全部（按「全部」會把其餘清掉） -->
        <div class="chips" id="fStatus">
          <button type="button" class="chip" data-val=""          aria-pressed="true"  data-i18n="list.all"></button>
          <button type="button" class="chip" data-val="SCHEDULED" aria-pressed="false" data-i18n="status.SCHEDULED"></button>
          <button type="button" class="chip" data-val="DONE"      aria-pressed="false" data-i18n="status.DONE"></button>
          <button type="button" class="chip" data-val="INCOMPLETE" aria-pressed="false" data-i18n="status.INCOMPLETE"></button>
          <button type="button" class="chip" data-val="PENDING"   aria-pressed="false" data-i18n="status.PENDING"></button>
          <button type="button" class="chip" data-val="CANCELLED" aria-pressed="false" data-i18n="status.CANCELLED"></button>
        </div>
      </div>

      <button type="button" class="chip" id="toggleMore" data-i18n="list.more">Filter lain</button>

      <div id="moreBox" hidden>
        <div class="field">
          <label for="fFactory" data-i18n="f.factory">Factory</label>
          <select id="fFactory"></select>
        </div>
        <div class="field">
          <label for="fDept" data-i18n="f.dept">Dept</label>
          <select id="fDept"></select>
        </div>
        <div class="field">
          <label for="fTitik" data-i18n="f.titik">Titik jemput</label>
          <select id="fTitik"></select>
        </div>
        <div class="field">
          <label for="fFlight" data-i18n="f.flight">NO Pesawat</label>
          <input type="text" id="fFlight" autocapitalize="characters" spellcheck="false" placeholder="CI761">
        </div>
        <label class="check">
          <input type="checkbox" id="fNeed">
          <span data-i18n="list.needOnly">Hanya yang ada permintaan</span>
        </label>
      </div>

    </section>

    <div class="listbar">
      <span class="count" id="statLine"></span>
      <label class="sortbox">
        <span data-i18n="list.sort">Urutkan</span>
        <select id="fSort">
          <option value="date"    data-i18n="list.sort.date">Tanggal</option>
          <option value="name"    data-i18n="list.sort.name">Nama</option>
          <option value="flight"  data-i18n="list.sort.flight">NO Pesawat</option>
          <option value="updated" data-i18n="list.sort.updated">Terakhir diubah</option>
        </select>
      </label>
      <button type="button" class="chip" id="resetBtn" data-i18n="list.reset">Hapus filter</button>
      <button type="button" class="chip" id="reloadBtn" data-i18n="list.reload">Muat ulang</button>
    </div>

    <div id="result" aria-live="polite"></div>

    <p class="loading-note" id="freshLine"></p>

  </div>

  <footer class="foot">
    <div id="footInfo"></div>
  </footer>

</main>

  <!--
    修改表單（v3.0）。

    ⚠️ 蓋在整個畫面上（不是插在列表中間）：手機上如果讓表單擠在兩筆資料之間，
       管理者一邊捲動一邊填，很容易填到一半就滑走了。蓋滿整頁就沒有這個問題。

    ⚠️ 送出的是**欄位代碼**（SCHEDULED、PICKUP），不是畫面上的文字。
       後端只認代碼，也只寫得進白名單裡的欄位（gas/Bookings.js 的 BOOKING_EDITABLE）。
  -->
  <div class="sheetwrap" id="editWrap" hidden>
    <div class="sheetbox" role="dialog" aria-modal="true" aria-labelledby="editTitle">

      <div class="sheethead">
        <h2 id="editTitle" data-i18n="edit.title">Ubah data</h2>
        <button type="button" class="iconbtn" id="editClose" aria-label="Close">✕</button>
      </div>

      <form id="editForm" class="sheetbody">
        <p class="subtle" id="editWho"></p>
        <div class="msg" id="editMsg" hidden></div>

        <!-- ── 常改的 ── -->
        <div class="field">
          <label for="eTanggal" data-i18n="edit.date">Tanggal pesawat</label>
          <input type="date" id="eTanggal" required>
          <div class="picked" id="ePickedDate" aria-live="polite"></div>
        </div>

        <div class="field2">
          <div class="field">
            <label for="eArah" data-i18n="edit.arah">Jemput / Antar</label>
            <select id="eArah" required>
              <option value="PICKUP"  data-i18n="arah.PICKUP"></option>
              <option value="DROPOFF" data-i18n="arah.DROPOFF"></option>
            </select>
          </div>
          <div class="field">
            <label for="eStatus" data-i18n="list.status">Status</label>
            <select id="eStatus" required>
              <option value="SCHEDULED"  data-i18n="status.SCHEDULED"></option>
              <option value="DONE"       data-i18n="status.DONE"></option>
              <option value="INCOMPLETE" data-i18n="status.INCOMPLETE"></option>
              <option value="PENDING"    data-i18n="status.PENDING"></option>
              <option value="CANCELLED"  data-i18n="status.CANCELLED"></option>
            </select>
          </div>
        </div>

        <div class="field2">
          <div class="field">
            <label for="eFlight" data-i18n="f.flight">NO Pesawat</label>
            <input type="text" id="eFlight" list="dlFlight" autocapitalize="characters" spellcheck="false">
            <datalist id="dlFlight"></datalist>
          </div>
          <div class="field">
            <label for="eEtd" data-i18n="f.etd">Jam pesawat</label>
            <input type="text" id="eEtd" inputmode="numeric" placeholder="14:20">
          </div>
        </div>

        <div class="field">
          <label for="eDariPci" data-i18n="f.pickup">Jam dari PCI</label>
          <input type="text" id="eDariPci" placeholder="20:00">
          <!-- ⚠️ 這一欄是純文字，兩種寫法（設計約定第 3 條）。說明一定要留著，
               不然管理者會打成 09/03 20:00 而被讀成 3 月 9 日 -->
          <span class="hint" data-i18n="edit.pciHint"></span>
        </div>

        <div class="field">
          <label for="eTitik" data-i18n="f.titik">Titik jemput</label>
          <input type="text" id="eTitik" list="dlTitik">
          <datalist id="dlTitik"></datalist>
        </div>

        <div class="field2">
          <div class="field">
            <label for="eBagasi" data-i18n="f.bagasi">Bagasi</label>
            <input type="text" id="eBagasi">
          </div>
          <div class="field">
            <label for="eRemark" data-i18n="f.remark">Catatan</label>
            <input type="text" id="eRemark">
          </div>
        </div>

        <!-- ── 派車（v3.0 新增，欄位 Z/AA/AB 早就備好了）── -->
        <h3 class="formsec" data-i18n="edit.sec.vehicle">Kendaraan</h3>
        <div class="field">
          <label for="eKendaraan" data-i18n="f.kendaraan">No. kendaraan</label>
          <input type="text" id="eKendaraan" autocapitalize="characters">
        </div>
        <div class="field2">
          <div class="field">
            <label for="eSopir" data-i18n="f.sopir">Sopir</label>
            <input type="text" id="eSopir">
          </div>
          <div class="field">
            <label for="eHpSopir" data-i18n="f.hpSopir">HP sopir</label>
            <input type="text" id="eHpSopir" inputmode="tel">
          </div>
        </div>

        <!-- ── 人員資料（收起來）── -->
        <button type="button" class="chip" id="ePersonToggle" data-i18n="edit.sec.person">Data orang</button>
        <div id="ePersonBox" hidden>
          <!-- ⚠️ 這一區是「名冊快照」（設計約定第 4 條）：新增當下就複製進來，
               之後名冊怎麼改都不會動到歷史紀錄。平常不該改，打錯字才改。 -->
          <p class="formhint" data-i18n="edit.personHint"></p>
          <div class="field">
            <label for="eName" data-i18n="edit.name">Nama</label>
            <input type="text" id="eName" required>
          </div>
          <div class="field2">
            <div class="field">
              <label for="eNamaCina" data-i18n="edit.namaCina">Nama Cina</label>
              <input type="text" id="eNamaCina">
            </div>
            <div class="field">
              <label for="eFactory" data-i18n="f.factory">Factory</label>
              <input type="text" id="eFactory" list="dlFactory">
              <datalist id="dlFactory"></datalist>
            </div>
          </div>
          <div class="field2">
            <div class="field">
              <label for="eDept" data-i18n="f.dept">Dept</label>
              <input type="text" id="eDept" list="dlDept">
              <datalist id="dlDept"></datalist>
            </div>
            <div class="field">
              <label for="eDorm" data-i18n="f.dorm">Kamar</label>
              <input type="text" id="eDorm">
            </div>
          </div>
          <div class="field2">
            <div class="field">
              <label for="eHp" data-i18n="f.hp">HP</label>
              <input type="text" id="eHp" inputmode="tel">
            </div>
            <div class="field">
              <label for="eCustom" data-i18n="f.custom">Custom</label>
              <select id="eCustom">
                <option value=""></option>
                <option value="YES">YES</option>
                <option value="NO">NO</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="eEmail" data-i18n="f.email">Email</label>
            <input type="text" id="eEmail" inputmode="email" autocapitalize="off">
          </div>
          <div class="field">
            <label for="eEmailKontak" data-i18n="f.emailKontak">Email kontak</label>
            <input type="text" id="eEmailKontak" inputmode="email" autocapitalize="off">
          </div>
          <div class="field2">
            <div class="field">
              <label for="ePovs" data-i18n="f.povs">POVS</label>
              <input type="text" id="ePovs">
            </div>
            <div class="field">
              <label for="eGroup" data-i18n="f.group">Grup</label>
              <input type="text" id="eGroup">
            </div>
          </div>
        </div>

        <div class="sheetfoot">
          <button type="submit" class="btn" id="eSave" data-i18n="edit.save">Simpan</button>
          <button type="button" class="btn btn--quiet" id="eCancel" data-i18n="edit.cancel">Batal</button>
          <button type="button" class="btn btn--danger" id="eDelete" data-i18n="edit.delete">Hapus</button>
        </div>
      </form>

    </div>
  </div>

<script src="js/config.js?v=3.1"></script>
<script src="js/i18n.js?v=3.1"></script>
<script src="js/api.js?v=3.1"></script>
<script src="js/admin-session.js?v=3.1"></script>
<script src="js/admin-list.js?v=3.1"></script>

</body>
</html>
