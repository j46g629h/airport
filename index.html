<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- 手機瀏覽器頂端網址列的顏色。沒有這一行的話，畫面最上面永遠有一條白條，
     跟我們的米白底色（--bg）對不起來。值必須跟 css/style.css 的 --bg 相同。 -->
<meta name="theme-color" content="#EFEFED">

<!-- ⚠️ 網站是公開的（免費方案的 Pages 只支援公開 repo），
     所以至少不要讓它被搜尋引擎收錄。知道網址的人才進得來。 -->
<meta name="robots" content="noindex, nofollow">

<!--
  圖示，三個位置各講不同的事：
    分頁圖示（16/32px）→ PCI      實測 16px 上三個字母已經是極限，再多會糊成一團
    主畫面圖示（180px）→ PCI GA   空間夠，放完整的標誌
    主畫面名稱          → 見 manifest.json，由作業系統畫，永遠清楚

  ⚠️ apple-touch-icon 一定要有 PNG——**iOS 不吃 SVG**。
     少了這個檔案，iPhone 加到主畫面時會拿「網頁截圖」當圖示。
  ⚠️ 那個 PNG 是**直角滿版**的：iOS 與 Android 會自己套圓角遮罩，
     圖檔自己再帶圓角的話會變成「圓角疊圓角」，四個角出現缺口。
-->
<link rel="icon" href="favicon.svg?v=3.2" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3.2">
<link rel="manifest" href="manifest.json?v=3.2">

<!-- CSS 還沒下載完之前先鋪底色，避免工廠 wifi 慢時先白閃一下 -->
<style>html{background:#EFEFED}</style>

<title>PCI Antar Jemput Bandara</title>
<!-- ⚠️ 改了 CSS 或 JS 一定要把 ?v= 往上加，其餘四個 HTML 也要一起改
     （tools/check.js 會比對，不一致就擋下來） -->
<link rel="stylesheet" href="css/style.css?v=3.2">
</head>
<body>

<!--
  ⚠️ wordmark（PCI GA）**只有首頁有**。
     內頁的人已經知道這是誰做的系統，他需要知道的是「這是什麼」，
     所以內頁把這個位置讓給標題。詳見 css/style.css 的 .wordmark 說明。
-->
<header class="topbar">
  <span class="wordmark" aria-label="PCI GA"><b>PCI</b><i>GA</i></span>
  <span class="brand" data-i18n="app.name">Antar Jemput Bandara</span>
  <nav class="lang" aria-label="Language">
    <button type="button" data-lang="id" aria-pressed="true">ID</button>
    <button type="button" data-lang="zh" aria-pressed="false">中</button>
  </nav>
</header>

<main class="wrap">

  <!--
    使用者入口。

    ⚠️ 這一格的說明比管理者那一格長，是刻意的：來這個網站的人有九成以上
       是一般同仁，而且**多半是第一次來、沒有人教過他**。管理者只有 2~3 位，
       是受過交代的。兩格一樣長只是版面好看，不是實際需要。

    ⚠️ 說明**只寫做得到的事**。「對自己那一筆提出需求」規格書裡有、
       但介面還沒做（目前只看得到管理者填的需求），所以這裡不能寫——
       寫了就會有人在頁面上找那個按鈕，找不到就打電話來問。
  -->
  <a class="entry entry--primary" href="query.html">
    <div class="entry-body">
      <div class="entry-title" data-i18n="home.query.title">Cek Jadwal Saya</div>
      <div class="entry-desc" data-i18n="home.query.desc">Untuk semua karyawan dan keluarga</div>
      <ul class="entry-list">
        <li data-i18n="home.query.p1"></li>
        <li data-i18n="home.query.p2"></li>
        <li data-i18n="home.query.p3"></li>
      </ul>
      <div class="entry-note" data-i18n="home.query.note"></div>
    </div>
    <span class="entry-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12h15"/><path d="M13 6l6 6-6 6"/>
      </svg>
    </span>
  </a>

  <!--
    管理者入口。

    ⚠️ 「依航班日期／航班號查詢」原本在這一格，v2.4 移走了，
       但**功能沒有下架**——它在 query.html 裡是三個分頁之一
       （Email / 航班日期 / 航班號）。使用者的實際需求是「知道當天
       同班機有誰、能不能一起搭車」（規格書 3.1），那個需求還在。

    ⚠️ 這裡跟頁尾的小連結指向**同一個登入頁**。一般管理者與超級管理者
       的差別是**登入之後**才分流的（見 admin.html 的 #adminNav），
       不是在首頁分兩個門。
  -->
  <a class="entry" href="admin.html">
    <div class="entry-body">
      <div class="entry-title" data-i18n="home.admin.title">Area Admin</div>
      <div class="entry-desc" data-i18n="home.admin.desc">Tambah, ubah, hapus data antar jemput (perlu akun)</div>
      <div class="entry-note" data-i18n="home.admin.note"></div>
    </div>
    <span class="entry-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12h15"/><path d="M13 6l6 6-6 6"/>
      </svg>
    </span>
  </a>

  <!--
    操作說明入口。
    ⚠️ 刻意**不做成第三張卡片**（作法沿用員工餐廳系統）：兩張卡片的份量差異
       （近黑實心 vs 淺色平面）是為了讓人兩秒內決定要做什麼，
       加第三張同等份量的會把這個層次打散。
       做成一條輕量連結，想找的人找得到，不想找的人不會被干擾。
    ⚠️ 同分頁開啟，不開新分頁——手機上新分頁只會讓人迷路，
       而首頁沒有任何狀態會因為離開而遺失。
  -->
  <a href="help.html" class="menu-help">
    <svg class="menu-help-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 6.8C10.6 5.6 8.6 5 6.3 5c-.9 0-1.8.1-2.5.2-.5.1-.8.5-.8 1v11.1c0 .6.5 1.1 1.2.9.6-.1 1.3-.2 2.1-.2 2 0 3.8.6 5 1.5.4.3 1 .3 1.4 0 1.2-.9 3-1.5 5-1.5.8 0 1.5.1 2.1.2.7.2 1.2-.3 1.2-.9V6.2c0-.5-.3-.9-.8-1-.7-.1-1.6-.2-2.5-.2-2.3 0-4.3.6-5.7 1.8z"
            fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M12 6.8v12.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
    <span data-i18n="home.help">Gimana caranya?</span>
  </a>

  <footer class="foot">
    <div id="footInfo"></div>
    <a class="foot-admin" id="footAdmin" href="admin.html">Login Admin</a>
  </footer>

</main>

<script src="js/config.js?v=3.2"></script>
<script src="js/i18n.js?v=3.2"></script>
<script>
  document.addEventListener('DOMContentLoaded', initLangSwitch);
</script>

</body>
</html>
