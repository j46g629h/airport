<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ⚠️ 網站是公開的（免費方案的 Pages 只支援公開 repo），
     所以至少不要讓它被搜尋引擎收錄。知道網址的人才進得來。 -->
<meta name="robots" content="noindex, nofollow">
<title>Antar Jemput Bandara — PCI adidas</title>
<!-- ⚠️ 改了 CSS 或 JS 一定要把 ?v= 往上加，query.html、admin.html 也要一起改 -->
<link rel="stylesheet" href="css/style.css?v=1.7">
</head>
<body>

<header class="topbar">
  <span class="brand" data-i18n="app.name">Antar Jemput Bandara</span>
  <nav class="lang" aria-label="Language">
    <button type="button" data-lang="id" aria-pressed="true">ID</button>
    <button type="button" data-lang="zh" aria-pressed="false">中</button>
  </nav>
</header>

<main class="wrap">

  <a class="entry" href="query.html">
    <div class="entry-title" data-i18n="home.query.title">Cek Jadwal Saya</div>
    <div class="entry-desc" data-i18n="home.query.desc">Masukkan email untuk melihat jadwal antar jemput Anda</div>
  </a>

  <a class="entry" href="query.html?mode=date">
    <div class="entry-title" data-i18n="home.list.title">Cari per Tanggal / NO Pesawat</div>
    <div class="entry-desc" data-i18n="home.list.desc">Lihat siapa saja yang berangkat pada hari atau penerbangan yang sama</div>
  </a>

  <footer class="foot">
    <div id="footInfo"></div>
    <a class="foot-admin" id="footAdmin" href="admin.html">Login Admin</a>
  </footer>

</main>

<script src="js/config.js?v=1.7"></script>
<script src="js/i18n.js?v=1.7"></script>
<script>
  document.addEventListener('DOMContentLoaded', initLangSwitch);
</script>

</body>
</html>
